services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: sodrujestvo
      POSTGRES_USER: sodrujestvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sodrujestvo -d sodrujestvo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: